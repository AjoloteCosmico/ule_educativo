<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artículos — ule educativo</title>
<meta name="description" content="Artículos sobre la historia, arqueología y vigencia del juego de pelota mesoamericano.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/nav.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/ads.css">
<link rel="icon" href="assets/logo/logo.png" type="image/png">
</head>
<body data-ad-page="articulos">
<a class="skip-link" href="#contenido-principal">Saltar al contenido</a>
<ule-nav></ule-nav>
<main id="contenido-principal"><section class="container section"><h1>Artículos</h1><p>Historia, arqueología y vigencia del juego de pelota mesoamericano.</p>
<form class="filtros" id="filtros-articulos" role="search" aria-label="Filtrar artículos"><div class="filtros__campo"><label for="buscar-articulos">Buscar</label><input type="search" id="buscar-articulos" name="buscar" placeholder="Título, resumen o etiqueta…" autocomplete="off"></div><div class="filtros__campo"><label for="categoria-articulos">Categoría</label><select id="categoria-articulos" name="categoria"><option value="">Todas</option></select></div><div class="filtros__campo"><label for="orden-articulos">Ordenar por fecha</label><select id="orden-articulos" name="orden"><option value="desc">Más recientes primero</option><option value="asc">Más antiguos primero</option></select></div></form>
<p class="filtros__resultados" id="contador-articulos" aria-live="polite"></p><div id="articulos-grid" class="articles-grid"><div class="catalog-loading" role="status">Cargando artículos…</div></div></section>
<section class="container section ad-section" aria-labelledby="anuncios-articulos"><h2 class="ad-section__title" id="anuncios-articulos">Comunidad</h2><div data-ad-slot data-ad-horizontal="true"></div></section></main>
<footer class="container section" style="text-align:center; opacity:0.7; font-size:var(--fs-anotacion);"><p>ule educativo · 2026</p></footer>
<auth-modal id="auth-modal"></auth-modal>
<script src="js/main.js"></script>
<script src="js/ule-nav.js"></script>
<script src="js/api/client.js"></script>
<script src="js/api/auth.js"></script>
<script src="js/api/session.js"></script>
<script src="js/auth-modal.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/loader.js"></script>
<script src="js/components.js"></script>
<script src="js/ads.js"></script>
<script>(function(){let allArticles=[];const grid=document.getElementById('articulos-grid'),contador=document.getElementById('contador-articulos'),inputBuscar=document.getElementById('buscar-articulos'),selectCategoria=document.getElementById('categoria-articulos'),selectOrden=document.getElementById('orden-articulos');function poblarCategorias(a){Array.from(new Set(a.map(x=>x.categoria).filter(Boolean))).sort().forEach(cat=>{const o=document.createElement('option');o.value=cat;o.textContent=cat;selectCategoria.appendChild(o);});}function coincideBusqueda(a,t){if(!t)return true;return[a.titulo,a.resumen,(a.etiquetas||[]).join(' ')].join(' ').toLowerCase().includes(t.toLowerCase());}function render(){const t=inputBuscar.value.trim(),c=selectCategoria.value,o=selectOrden.value;let f=allArticles.filter(a=>coincideBusqueda(a,t)&&(!c||a.categoria===c));f.sort((a,b)=>o==='asc'?(a.fecha||'').localeCompare(b.fecha||''):(b.fecha||'').localeCompare(a.fecha||''));grid.innerHTML='';if(!f.length)grid.innerHTML='<div class="catalog-empty">No hay artículos que coincidan con tu búsqueda.</div>';else f.forEach(a=>{const card=document.createElement('article-card');card.setAttribute('data-id',a.id);card.setAttribute('data-title',a.titulo||'');card.setAttribute('data-summary',a.resumen||'');card.setAttribute('data-image',a.imagen_destacada||'');card.setAttribute('data-category',a.categoria||'');card.setAttribute('data-date',a.fecha||'');card.setAttribute('data-author',a.autor||'');card.setAttribute('data-href','articulo.html?id='+encodeURIComponent(a.id));card.setAttribute('data-heading-level','2');grid.appendChild(card);});contador.textContent=f.length===1?'1 artículo encontrado':f.length+' artículos encontrados';}async function init(){try{allArticles=await ULE.loader.loadArticles();poblarCategorias(allArticles);render();}catch(e){console.error('[ULE] Error cargando artículos:',e);grid.innerHTML='<div class="catalog-empty" role="alert">No fue posible cargar los artículos. Inténtalo de nuevo en unos minutos.</div>';contador.textContent='';}}inputBuscar.addEventListener('input',render);selectCategoria.addEventListener('change',render);selectOrden.addEventListener('change',render);init();})();</script>
</body></html>
