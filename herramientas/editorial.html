<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel editorial — ule educativo</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/herramientas.css">
<link rel="stylesheet" href="../css/nav.css">
<link rel="icon" href="../assets/logo/logo.png" type="image/png">
</head>
<body>
<a class="skip-link" href="#contenido-principal">Saltar al contenido</a>
<ule-nav></ule-nav>
<auth-modal id="auth-modal"></auth-modal>

<main id="contenido-principal">
<section class="container section">
<h1>Panel editorial</h1>
<p>Gestiona el contenido de <em>ule educativo</em>. Requiere rol <strong>contributor</strong> o <strong>admin</strong>.</p>
<div id="editorial-alert" class="form-tool__ayuda" role="status" aria-live="polite"></div>

<div id="editorial-app" hidden>
<div class="catalog-selector" id="editorial-tabs" role="tablist" aria-label="Tipo de contenido">
<button class="catalog-selector__tab" type="button" role="tab" data-resource="articles" aria-selected="true">Artículos</button>
<button class="catalog-selector__tab" type="button" role="tab" data-resource="bibliography" aria-selected="false">Bibliografía</button>
<button class="catalog-selector__tab" type="button" role="tab" data-resource="catalogs" aria-selected="false">Colecciones</button>
<button class="catalog-selector__tab" type="button" role="tab" data-resource="ads" aria-selected="false">Anuncios</button>
</div>

<div class="form-tool__resultado is-visible">
<div class="editorial-list-head">
  <div>
    <h2 id="editorial-title">Artículos</h2>
    <p id="editorial-count" class="form-tool__ayuda" aria-live="polite"></p>
  </div>
  <button class="button" type="button" id="editorial-new">Nuevo</button>
</div>
<div class="editorial-list-tools">
  <label class="editorial-list-search">
    <span>Buscar en el listado</span>
    <input type="search" id="editorial-search" placeholder="Título, ID o nombre…" autocomplete="off">
  </label>
</div>
<div id="editorial-list" class="catalog-loading" role="status">Cargando…</div>
</div>

<div class="form-tool" id="editorial-form-panel">
<div class="cluster" style="justify-content:space-between;">
<h2 id="editorial-form-title">Nuevo contenido</h2>
<button class="button" type="button" id="editorial-cancel">Cancelar</button>
</div>
<form id="editorial-form" novalidate></form>
</div>
</div>
</section>
</main>

<script src="../js/main.js"></script>
<script src="../js/loader.js"></script>
<script src="../js/api/client.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/api/session.js"></script>
<script src="../js/auth-modal.js"></script>
<script src="../js/auth-ui.js"></script>
<script src="../js/ule-nav.js"></script>
<script>
(function () {
  'use strict';

  var app = document.getElementById('editorial-app');
  var alertBox = document.getElementById('editorial-alert');
  var list = document.getElementById('editorial-list');
  var panel = document.getElementById('editorial-form-panel');
  var form = document.getElementById('editorial-form');
  var title = document.getElementById('editorial-title');
  var formTitle = document.getElementById('editorial-form-title');
  var resource = 'articles';
  var editing = null;
  var records = [];
  var saving = false;
  var listSearch = '';
  var contentBlocks = [];
  var blocksContainer = null;
  var contentPreview = null;
  var blockTypeLabels = {
    encabezado: 'Encabezado',
    parrafo: 'Párrafo',
    imagen: 'Imagen',
    lista: 'Lista',
    cita: 'Cita',
    legado: 'Contenido existente (no editable por bloques)'
  };

  var labels = {
    articles: 'Artículos',
    bibliography: 'Bibliografía',
    catalogs: 'Colecciones',
    ads: 'Anuncios'
  };

  function field(name, label, type, options) {
    options = options || {};
    var wrap = document.createElement('div');
    wrap.className = 'form-tool__grupo';
    wrap.dataset.field = name;
    var lab = document.createElement('label');
    lab.htmlFor = 'editorial-' + name;
    lab.textContent = label + (options.required ? ' *' : '');
    if (type !== 'hidden') wrap.appendChild(lab);
    var input;
    if (type === 'textarea') {
      input = document.createElement('textarea');
      if (options.rows) input.rows = options.rows;
    } else if (type === 'select') {
      input = document.createElement('select');
      (options.options || []).forEach(function (item) {
        var opt = document.createElement('option');
        opt.value = item.value;
        opt.textContent = item.label;
        input.appendChild(opt);
      });
    } else {
      input = document.createElement('input');
      input.type = type || 'text';
    }
    input.id = 'editorial-' + name;
    input.name = name;
    input.required = !!options.required;
    if (options.pattern) input.pattern = options.pattern;
    if (options.min !== undefined) input.min = options.min;
    if (options.step) input.step = options.step;
    if (options.placeholder) input.placeholder = options.placeholder;
    if (options.accept) input.accept = options.accept;
    wrap.appendChild(input);
    if (options.help) {
      var help = document.createElement('p');
      help.className = 'form-tool__ayuda';
      help.textContent = options.help;
      wrap.appendChild(help);
    }
    return wrap;
  }

  function checkbox(name, label, checked) {
    var wrap = document.createElement('div');
    wrap.className = 'form-tool__checkbox-fila';
    wrap.dataset.field = name;
    var input = document.createElement('input');
    input.type = 'checkbox';
    input.id = 'editorial-' + name;
    input.name = name;
    input.checked = checked !== false;
    var lab = document.createElement('label');
    lab.htmlFor = input.id;
    lab.textContent = label;
    wrap.append(input, lab);
    return wrap;
  }

  function arrayField(name, label, required, help) {
    return field(name, label, 'textarea', {
      required: required,
      rows: 3,
      placeholder: 'Un valor por línea',
      help: help || 'Un valor por línea. Se enviará como un arreglo.'
    });
  }

  function idOptions() {
    return {
      required: true,
      pattern: '[a-z0-9]+([-_][a-z0-9]+)*',
      help: 'Solo minúsculas, números, guion y guion bajo.'
    };
  }

  /* ---------- Editor de contenido por bloques (Fase 1) ----------
     El usuario que captura nunca ve ni escribe HTML: cada bloque es un
     conjunto de campos de formulario normales. El HTML se genera aquí
     mismo justo antes de enviar el payload, con el mismo vocabulario de
     etiquetas que ya documentaba el campo (h2/h3, p, img, ul/li,
     blockquote). El contrato de datos no cambia: contenido_html sigue
     viajando como el mismo string de siempre. */

  function isValidImageUrl(url) {
    return /^https?:\/\//i.test(String(url || '').trim());
  }

  function newBlock(type) {
    if (type === 'encabezado') return { type: type, nivel: 'h2', texto: '' };
    if (type === 'imagen') return { type: type, url: '', alt: '' };
    return { type: type, texto: '' };
  }

  function compileBlocksToHtml(blocks) {
    return blocks.map(function (b) {
      if (b.type === 'legado') return b.html || '';
      if (b.type === 'encabezado') {
        var nivel = b.nivel === 'h3' ? 'h3' : 'h2';
        return '<' + nivel + '>' + htmlEscape(b.texto) + '</' + nivel + '>';
      }
      if (b.type === 'parrafo') return '<p>' + htmlEscape(b.texto || '').replace(/\n/g, '<br>') + '</p>';
      if (b.type === 'imagen') return '<img src="' + htmlEscape(b.url) + '" alt="' + htmlEscape(b.alt) + '">';
      if (b.type === 'lista') {
        var items = String(b.texto || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
        if (!items.length) return '';
        return '<ul>\n' + items.map(function (i) { return '<li>' + htmlEscape(i) + '</li>'; }).join('\n') + '\n</ul>';
      }
      if (b.type === 'cita') return '<blockquote>' + htmlEscape(b.texto) + '</blockquote>';
      return '';
    }).filter(Boolean).join('\n\n');
  }

  function htmlEscape(text) {
    var div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
  }

  function parseHtmlToBlocks(html) {
    var container = document.createElement('div');
    container.innerHTML = String(html || '');
    var blocks = [];
    Array.prototype.forEach.call(container.childNodes, function (node) {
      if (node.nodeType === 3) {
        var text = node.textContent.trim();
        if (text) blocks.push({ type: 'legado', html: htmlEscape(text) });
        return;
      }
      if (node.nodeType !== 1) return;
      var tag = node.tagName.toLowerCase();
      if (tag === 'h2' || tag === 'h3') {
        blocks.push({ type: 'encabezado', nivel: tag, texto: node.textContent.trim() });
      } else if (tag === 'p') {
        var tmp = document.createElement('div');
        tmp.innerHTML = node.innerHTML.replace(/<br\s*\/?>/gi, '\n');
        blocks.push({ type: 'parrafo', texto: tmp.textContent.trim() });
      } else if (tag === 'img') {
        blocks.push({ type: 'imagen', url: node.getAttribute('src') || '', alt: node.getAttribute('alt') || '' });
      } else if (tag === 'ul' || tag === 'ol') {
        var items = Array.prototype.map.call(node.querySelectorAll('li'), function (li) {
          return li.textContent.trim();
        }).filter(Boolean);
        blocks.push({ type: 'lista', texto: items.join('\n') });
      } else if (tag === 'blockquote') {
        blocks.push({ type: 'cita', texto: node.textContent.trim() });
      } else {
        blocks.push({ type: 'legado', html: node.outerHTML });
      }
    });
    return blocks;
  }

  function renderContentPreview() {
    if (!contentPreview) return;
    var body = contentPreview.querySelector('.editorial-content-preview__body');
    if (!body) return;
    body.innerHTML = compileBlocksToHtml(contentBlocks);
    var empty = contentPreview.querySelector('.editorial-content-preview__empty');
    if (empty) empty.hidden = !!contentBlocks.length;
  }

  function syncHiddenField() {
    var hidden = form.elements.contenido_html;
    if (hidden) hidden.value = compileBlocksToHtml(contentBlocks);
    renderContentPreview();
    validateForm();
  }

  function moveBlock(index, dir) {
    var target = index + dir;
    if (target < 0 || target >= contentBlocks.length) return;
    var tmp = contentBlocks[index];
    contentBlocks[index] = contentBlocks[target];
    contentBlocks[target] = tmp;
    renderBlockEditor();
  }

  function removeBlock(index) {
    contentBlocks.splice(index, 1);
    renderBlockEditor();
  }

  function updateBlock(index, key, val) {
    contentBlocks[index][key] = val;
    syncHiddenField();
  }

  function addBlock(type) {
    contentBlocks.push(newBlock(type));
    renderBlockEditor();
  }

  function blockCard(block, index) {
    var card = document.createElement('div');
    card.className = 'content-block';

    var head = document.createElement('div');
    head.className = 'content-block__head';
    var label = document.createElement('strong');
    label.textContent = (index + 1) + '. ' + (blockTypeLabels[block.type] || block.type);
    var actions = document.createElement('div');
    actions.className = 'content-block__actions';
    var up = document.createElement('button');
    up.type = 'button'; up.className = 'button'; up.textContent = '↑';
    up.setAttribute('aria-label', 'Mover bloque arriba');
    up.disabled = index === 0;
    up.addEventListener('click', function () { moveBlock(index, -1); });
    var down = document.createElement('button');
    down.type = 'button'; down.className = 'button'; down.textContent = '↓';
    down.setAttribute('aria-label', 'Mover bloque abajo');
    down.disabled = index === contentBlocks.length - 1;
    down.addEventListener('click', function () { moveBlock(index, 1); });
    var del = document.createElement('button');
    del.type = 'button'; del.className = 'button'; del.textContent = 'Eliminar';
    del.addEventListener('click', function () { removeBlock(index); });
    actions.append(up, down, del);
    head.append(label, actions);
    card.appendChild(head);

    if (block.type === 'legado') {
      var note = document.createElement('p');
      note.className = 'form-tool__ayuda';
      note.textContent = 'Contenido existente que todavía no se puede editar por bloques. Se conserva igual al guardar, o puedes eliminarlo.';
      card.appendChild(note);
    } else if (block.type === 'encabezado') {
      var nivelSel = document.createElement('select');
      [['h2', 'Sección (H2)'], ['h3', 'Subsección (H3)']].forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o[0]; opt.textContent = o[1];
        if (block.nivel === o[0]) opt.selected = true;
        nivelSel.appendChild(opt);
      });
      nivelSel.addEventListener('change', function () { updateBlock(index, 'nivel', nivelSel.value); });
      var textoEnc = document.createElement('input');
      textoEnc.type = 'text'; textoEnc.value = block.texto || ''; textoEnc.placeholder = 'Texto del encabezado';
      textoEnc.addEventListener('input', function () { updateBlock(index, 'texto', textoEnc.value); });
      card.append(nivelSel, textoEnc);
    } else if (block.type === 'parrafo' || block.type === 'cita') {
      var ta = document.createElement('textarea');
      ta.rows = 4; ta.value = block.texto || '';
      ta.placeholder = block.type === 'cita' ? 'Texto de la cita' : 'Texto del párrafo';
      ta.addEventListener('input', function () { updateBlock(index, 'texto', ta.value); });
      card.appendChild(ta);
    } else if (block.type === 'lista') {
      var lta = document.createElement('textarea');
      lta.rows = 4; lta.value = block.texto || ''; lta.placeholder = 'Un elemento por línea';
      lta.addEventListener('input', function () { updateBlock(index, 'texto', lta.value); });
      card.appendChild(lta);
    } else if (block.type === 'imagen') {
      var url = document.createElement('input');
      url.type = 'url'; url.value = block.url || ''; url.placeholder = 'https://…';
      url.addEventListener('input', function () { updateBlock(index, 'url', url.value); });
      var alt = document.createElement('input');
      alt.type = 'text'; alt.value = block.alt || ''; alt.placeholder = 'Texto alternativo (obligatorio)';
      alt.addEventListener('input', function () { updateBlock(index, 'alt', alt.value); });
      var imagePreview = document.createElement('div');
      imagePreview.className = 'content-block__image-preview';
      var imagePreviewImg = document.createElement('img');
      imagePreviewImg.alt = '';
      imagePreviewImg.loading = 'lazy';
      imagePreviewImg.hidden = !isValidImageUrl(block.url);
      imagePreviewImg.src = isValidImageUrl(block.url) ? block.url : '';
      imagePreview.appendChild(imagePreviewImg);
      url.addEventListener('input', function () {
        var valid = isValidImageUrl(url.value);
        imagePreviewImg.hidden = !valid;
        imagePreviewImg.src = valid ? url.value.trim() : '';
      });
      var helpImg = document.createElement('p');
      helpImg.className = 'form-tool__ayuda';
      helpImg.textContent = 'Por ahora la imagen solo puede venir de un enlace (URL). La vista previa no se envía a la API.';
      card.append(url, alt, imagePreview, helpImg);
    }
    return card;
  }

  function renderBlockEditor() {
    if (!blocksContainer) return;
    blocksContainer.replaceChildren();
    if (!contentBlocks.length) {
      var empty = document.createElement('p');
      empty.className = 'form-tool__ayuda';
      empty.textContent = 'Todavía no hay bloques. Agrega uno abajo.';
      blocksContainer.appendChild(empty);
    }
    contentBlocks.forEach(function (block, index) {
      blocksContainer.appendChild(blockCard(block, index));
    });
    syncHiddenField();
  }

  function buildContentEditor() {
    var wrap = document.createElement('div');
    wrap.className = 'form-tool__grupo';
    var label = document.createElement('label');
    label.textContent = 'Contenido';
    wrap.appendChild(label);
    var help = document.createElement('p');
    help.className = 'form-tool__ayuda';
    help.textContent = 'Arma el cuerpo del artículo por bloques. No hace falta escribir HTML.';
    wrap.appendChild(help);

    blocksContainer = document.createElement('div');
    blocksContainer.className = 'content-blocks';
    wrap.appendChild(blocksContainer);

    contentPreview = document.createElement('section');
    contentPreview.className = 'editorial-content-preview';
    contentPreview.setAttribute('aria-label', 'Vista previa del contenido');
    var previewHead = document.createElement('div');
    previewHead.className = 'editorial-content-preview__head';
    var previewTitle = document.createElement('strong');
    previewTitle.textContent = 'Vista previa';
    var previewHelp = document.createElement('span');
    previewHelp.textContent = 'Así se verá el cuerpo del artículo.';
    previewHead.append(previewTitle, previewHelp);
    var previewArticle = document.createElement('article');
    previewArticle.className = 'articulo editorial-content-preview__article';
    var previewBody = document.createElement('div');
    previewBody.className = 'articulo__cuerpo editorial-content-preview__body';
    var previewEmpty = document.createElement('p');
    previewEmpty.className = 'editorial-content-preview__empty';
    previewEmpty.textContent = 'Agrega bloques para ver una vista previa.';
    previewArticle.append(previewBody, previewEmpty);
    contentPreview.append(previewHead, previewArticle);
    wrap.appendChild(contentPreview);

    var addRow = document.createElement('div');
    addRow.className = 'form-tool__acciones';
    var typeSelect = document.createElement('select');
    [['encabezado', 'Encabezado'], ['parrafo', 'Párrafo'], ['imagen', 'Imagen'], ['lista', 'Lista'], ['cita', 'Cita']].forEach(function (o) {
      var opt = document.createElement('option');
      opt.value = o[0]; opt.textContent = o[1];
      typeSelect.appendChild(opt);
    });
    var addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'button'; addBtn.textContent = '+ Agregar bloque';
    addBtn.addEventListener('click', function () { addBlock(typeSelect.value); });
    addRow.append(typeSelect, addBtn);
    wrap.appendChild(addRow);

    renderBlockEditor();
    renderContentPreview();
    return wrap;
  }
  /* ---------- fin editor de bloques ---------- */

  function buildForm(record) {
    form.replaceChildren();
    var r = record || {};
    if (resource === 'articles' && !editing) {
      r = Object.assign({ contenido_html: '<h2>Sección</h2>\n<p>Contenido…</p>' }, r);
    }
    blocksContainer = null;
    contentBlocks = resource === 'articles' ? parseHtmlToBlocks(r.contenido_html || '') : [];

    var fields = [];

    if (resource === 'articles') {
      fields = [
        field('id', 'ID', 'hidden', idOptions()),
        field('titulo', 'Título', 'text', { required: true }),
        field('autor', 'Autor', 'text', { required: true, placeholder: 'Obligatorio' }),
        field('fecha', 'Fecha', 'date', { required: true }),
        field('resumen', 'Resumen', 'textarea', { required: true, rows: 4 }),
        field('contenido_html', 'Contenido HTML', 'hidden', {}),
        field('imagen_destacada', 'Imagen destacada', 'url', { placeholder: 'https://…', help: 'Opcional.' }),
        field('imagen_alt', 'Texto alternativo de imagen', 'text', { placeholder: 'Opcional' }),
        field('categoria', 'Categoría', 'text', { placeholder: 'Opcional' }),
        arrayField('etiquetas', 'Etiquetas', false),
        arrayField('bibliografia_relacionada', 'Bibliografía relacionada', false, 'IDs de bibliografía, uno por línea (campo bibliografía_relacionada).'),
        checkbox('visible', 'Visible', r.visible !== false)
      ];
    } else if (resource === 'bibliography') {
      fields = [
        field('id', 'ID', 'text', idOptions()),
        field('titulo', 'Título', 'text', { required: true }),
        arrayField('autores', 'Autores', true, 'Uno o más autores, uno por línea.'),
        field('anio', 'Año', 'number', { min: 0, step: 1 }),
        field('tipo', 'Tipo', 'select', {
          required: true,
          options: [
            { value: 'libro', label: 'Libro' },
            { value: 'capitulo_libro', label: 'Capítulo de libro' },
            { value: 'articulo', label: 'Artículo' },
            { value: 'articulo_web', label: 'Artículo web' },
            { value: 'web', label: 'Web' }
          ]
        }),
        field('editorial', 'Editorial', 'text', { placeholder: 'Opcional' }),
        field('resumen', 'Resumen', 'textarea', { rows: 4, placeholder: 'Opcional' }),
        field('url', 'URL', 'url', { placeholder: 'https://…', help: 'Opcional.' }),
        checkbox('visible', 'Visible', r.visible !== false),
        arrayField('articulos_relacionados', 'Artículos relacionados', false, 'IDs de artículos, uno por línea (opcional).')
      ];
    } else if (resource === 'catalogs') {
      fields = [
        field('id', 'ID', 'text', idOptions()),
        field('titulo', 'Título', 'text', { required: true }),
        field('descripcion', 'Descripción', 'textarea', { rows: 4, placeholder: 'Opcional' }),
        field('imagen_portada', 'Imagen de portada', 'url', { placeholder: 'https://…', help: 'Opcional.' }),
        field('detalles', 'Detalles', 'textarea', {
          rows: 8,
          placeholder: 'Clave y valor, uno por línea. Ej.: periodo=clasico',
          help: 'Datos adicionales del catálogo como pares clave=valor.'
        }),
        checkbox('visible', 'Visible', r.visible !== false)
      ];
    } else {
      fields = [
        field('id', 'ID', 'text', idOptions()),
        field('imagen', 'Imagen', 'url', { placeholder: 'https://…', help: 'Opcional.' }),
        field('imagen_alt', 'Texto alternativo de imagen', 'text', { placeholder: 'Opcional' }),
        field('contacto', 'Contacto', 'text', { placeholder: 'Opcional' }),
        field('slogan', 'Slogan', 'text', { placeholder: 'Opcional' }),
        field('descripcion', 'Descripción', 'textarea', { rows: 4, placeholder: 'Opcional' }),
        field('vigencia_inicio', 'Vigencia inicio', 'date'),
        field('vigencia_fin', 'Vigencia fin', 'date'),
        checkbox('activo', 'Activo', r.activo !== false),
        field('peso', 'Peso', 'number', { min: 1, step: 1 }),
        field('enlace', 'Enlace', 'url', { placeholder: 'https://…', help: 'Opcional.' }),
        field('tipo', 'Tipo', 'select', {
          required: true,
          options: [
            { value: 'evento', label: 'Evento' },
            { value: 'taller', label: 'Taller' },
            { value: 'exhibicion', label: 'Exhibición' },
            { value: 'sponsor', label: 'Sponsor' },
            { value: 'comunidad', label: 'Comunidad' },
            { value: 'otro', label: 'Otro' }
          ]
        }),
        arrayField('paginas', 'Páginas', false, 'home, articulos, articulo, catalogos, bibliografia o todas; una por línea.'),
        field('prioridad_slot', 'Prioridad del slot', 'text', { placeholder: 'Opcional' })
      ];
    }

    var row = document.createElement('div');
    row.className = 'form-tool__fila form-tool__fila--2';
    fields.forEach(function (f) {
      var name = f.dataset.field;
      if (name === 'id' || name === 'fecha' || name === 'anio' ||
          name === 'vigencia_inicio' || name === 'vigencia_fin' || name === 'tipo') {
        row.appendChild(f);
      } else if (name === 'contenido_html') {
        form.appendChild(f); // campo oculto, se sincroniza desde el editor de bloques
        form.appendChild(buildContentEditor());
      } else {
        form.appendChild(f);
      }
    });
    if (row.children.length) form.insertBefore(row, form.firstChild);

    var actions = document.createElement('div');
    actions.className = 'form-tool__acciones';
    var saveBtn = document.createElement('button');
    saveBtn.className = 'button';
    saveBtn.type = 'submit';
    saveBtn.id = 'editorial-save';
    saveBtn.textContent = editing ? 'Guardar cambios' : 'Guardar';
    saveBtn.disabled = true;
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'button';
    cancelBtn.type = 'button';
    cancelBtn.textContent = 'Cancelar';
    cancelBtn.id = 'editorial-cancel-form';
    cancelBtn.addEventListener('click', closeForm);
    actions.append(saveBtn, cancelBtn);
    if (editing) {
      var del = document.createElement('button');
      del.className = 'button';
      del.type = 'button';
      del.textContent = 'Eliminar';
      del.addEventListener('click', function () { removeRecord(editing); });
      actions.appendChild(del);
    }
    form.appendChild(actions);

    populate(r);
    if (!editing && form.elements.id) generateId();
    validateForm();
  }

  function parseArray(value) {
    return String(value || '').split(/[\n,]/).map(function (x) { return x.trim(); }).filter(Boolean);
  }

  function parseDetails(value) {
    var details = {};
    String(value || '').split('\n').forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var pos = line.indexOf('=');
      if (pos < 1) throw new Error('Cada detalle debe tener formato clave=valor.');
      details[line.slice(0, pos).trim()] = line.slice(pos + 1).trim();
    });
    return details;
  }

  function value(name) {
    var el = form.elements[name];
    return el ? el.value.trim() : '';
  }

  function bool(name) {
    var el = form.elements[name];
    return !!el && el.checked;
  }

  function validateForm() {
    var saveBtn = document.getElementById('editorial-save');
    if (!saveBtn) return;
    var valid = form.checkValidity();
    try {
      if (resource === 'articles') {
        if (!contentBlocks.length) valid = false;
        contentBlocks.forEach(function (b) {
          if (b.type === 'imagen' && (!isValidImageUrl(b.url) || !String(b.alt || '').trim())) valid = false;
          if ((b.type === 'encabezado' || b.type === 'parrafo' || b.type === 'cita') && !String(b.texto || '').trim()) valid = false;
          if (b.type === 'lista' && !String(b.texto || '').split('\n').some(function (x) { return x.trim(); })) valid = false;
        });
      }
      if (resource === 'catalogs') parseDetails(value('detalles'));
      if (resource === 'ads' && value('vigencia_inicio') && value('vigencia_fin') && value('vigencia_fin') < value('vigencia_inicio')) valid = false;
    } catch (e) { valid = false; }
    saveBtn.disabled = !valid || saving;
    form.setAttribute('aria-invalid', String(!valid));
  }

  function payloadFromForm() {
    var p = {};
    if (resource === 'articles') {
      p = {
        id: value('id'),
        titulo: value('titulo'),
        autor: value('autor'),
        fecha: value('fecha'),
        resumen: value('resumen'),
        contenido_html: value('contenido_html'),
        imagen_destacada: value('imagen_destacada') || null,
        imagen_alt: value('imagen_alt') || null,
        categoria: value('categoria') || null,
        etiquetas: parseArray(value('etiquetas')),
        'bibliografía_relacionada': parseArray(value('bibliografia_relacionada')),
        visible: bool('visible')
      };
    } else if (resource === 'bibliography') {
      p = {
        id: value('id'),
        titulo: value('titulo'),
        autores: parseArray(value('autores')),
        'año': value('anio') ? Number(value('anio')) : null,
        tipo: value('tipo'),
        editorial: value('editorial') || null,
        resumen: value('resumen') || null,
        url: value('url') || null,
        visible: bool('visible'),
        articulos_relacionados: parseArray(value('articulos_relacionados'))
      };
    } else if (resource === 'catalogs') {
      p = {
        id: value('id'),
        titulo: value('titulo'),
        descripcion: value('descripcion') || null,
        imagen_portada: value('imagen_portada') || null,
        detalles: parseDetails(value('detalles')),
        visible: bool('visible')
      };
    } else {
      p = {
        id: value('id'),
        imagen: value('imagen') || null,
        imagen_alt: value('imagen_alt') || null,
        contacto: value('contacto') || null,
        slogan: value('slogan') || null,
        descripcion: value('descripcion') || null,
        vigencia_inicio: value('vigencia_inicio') || null,
        vigencia_fin: value('vigencia_fin') || null,
        activo: bool('activo'),
        peso: value('peso') ? Number(value('peso')) : 1,
        enlace: value('enlace') || null,
        tipo: value('tipo'),
        paginas: parseArray(value('paginas')),
        prioridad_slot: value('prioridad_slot') || null
      };
    }
    return p;
  }

  function slugify(text) {
    return String(text || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'contenido';
  }

  function generateId() {
    var titleValue = value('titulo') || value('slogan') || labels[resource].toLowerCase();
    var base = slugify(titleValue);
    var existing = {};
    records.forEach(function (record) { if (record.id) existing[record.id] = true; });
    var id = base;
    var n = 2;
    while (existing[id] && (!editing || id !== editing)) id = base + '-' + n++;
    if (form.elements.id) form.elements.id.value = id;
    return id;
  }

  function populate(r) {
    r = r || {};
    var aliases = {
      anio: r['año'] != null ? r['año'] : r.anio,
      bibliografia_relacionada: r['bibliografía_relacionada'] || r.bibliografia_relacionada || r.bibliography_ids,
      articulos_relacionados: r.articulos_relacionados || r.article_ids,
      vigencia_inicio: r.vigencia_inicio || r.inicio,
      vigencia_fin: r.vigencia_fin || r.fin
    };
    Object.keys(aliases).forEach(function (k) {
      if (aliases[k] != null && r[k] == null) r[k] = aliases[k];
    });

    Object.keys(r).forEach(function (key) {
      if (key === 'contenido_html') return; // ya sincronizado por el editor de bloques
      var formKey = key;
      if (key === 'año') formKey = 'anio';
      if (key === 'bibliografía_relacionada') formKey = 'bibliografia_relacionada';
      var el = form.elements[formKey] || form.elements[key];
      if (!el) return;
      if (el.type === 'checkbox') el.checked = r[key] !== false;
      else if (Array.isArray(r[key])) el.value = r[key].join('\n');
      else if ((key === 'detalles') && r[key] && typeof r[key] === 'object') {
        el.value = Object.keys(r[key]).map(function (k) { return k + '=' + r[key][k]; }).join('\n');
      } else el.value = r[key] == null ? '' : r[key];
    });
    if (form.elements.id) form.elements.id.disabled = !!editing;
  }

  function setAlert(text, error) {
    alertBox.textContent = text || '';
    alertBox.setAttribute('role', error ? 'alert' : 'status');
  }

  async function load() {
    list.className = 'catalog-loading';
    list.textContent = 'Cargando ' + labels[resource].toLowerCase() + '…';
    try {
      var data = await ULE.api.request('/' + resource);
      records = Array.isArray(data) ? data : (data.items || data.data || []);
      renderList();
    } catch (e) {
      list.className = 'catalog-empty';
      list.textContent = 'No fue posible cargar el contenido (HTTP ' + (e.status || 'red') + ').';
    }
  }

  function renderList() {
    var query = listSearch.trim().toLowerCase();
    var filtered = records.filter(function (r) {
      if (!query) return true;
      return [r.id, r.titulo, r.slogan, r.nombre].join(' ').toLowerCase().includes(query);
    });
    var count = document.getElementById('editorial-count');
    if (count) {
      count.textContent = records.length
        ? (filtered.length + ' de ' + records.length + ' registros')
        : 'Sin registros';
    }
    if (!records.length) {
      list.className = 'catalog-empty';
      list.textContent = 'No hay registros disponibles.';
      return;
    }
    if (!filtered.length) {
      list.className = 'catalog-empty';
      list.textContent = 'No hay registros que coincidan con la búsqueda.';
      return;
    }
    list.className = '';
    list.replaceChildren();
    var table = document.createElement('table');
    table.className = 'editorial-table';
    table.innerHTML = '<thead><tr><th>ID</th><th>Nombre</th><th>Estado</th><th>Acciones</th></tr></thead>';
    var body = document.createElement('tbody');
    filtered.forEach(function (r) {
      var tr = document.createElement('tr');
      var id = r.id || '';
      var name = r.titulo || r.slogan || id;
      var visible = resource === 'ads' ? r.activo !== false : r.visible !== false;
      [id, name, visible ? 'Visible' : 'Oculto'].forEach(function (txt) {
        var td = document.createElement('td');
        td.textContent = txt;
        tr.appendChild(td);
      });
      var actions = document.createElement('td');
      var edit = document.createElement('button');
      edit.className = 'button';
      edit.type = 'button';
      edit.textContent = 'Editar';
      edit.addEventListener('click', function () {
        editing = r.id;
        formTitle.textContent = 'Editar ' + labels[resource].toLowerCase();
        buildForm(r);
        panel.classList.add('is-active');
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      var remove = document.createElement('button');
      remove.className = 'button';
      remove.type = 'button';
      remove.textContent = 'Eliminar';
      remove.addEventListener('click', function () { removeRecord(id); });
      actions.append(edit, remove);
      tr.appendChild(actions);
      body.appendChild(tr);
    });
    table.appendChild(body);
    list.appendChild(table);
  }

  function openNew() {
    editing = null;
    formTitle.textContent = 'Nuevo ' + labels[resource].toLowerCase().replace(/s$/, '');
    buildForm({});
    panel.classList.add('is-active');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeForm() {
    panel.classList.remove('is-active');
    form.replaceChildren();
    editing = null;
    saving = false;
  }

  async function onSubmit(e) {
    e.preventDefault();
    e.stopPropagation();
    if (saving) return;
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    var payload;
    try {
      payload = payloadFromForm();
    } catch (err) {
      setAlert(err.message || 'Revisa el formulario.', true);
      return;
    }
    if (!payload.id) {
      setAlert('Falta el ID del registro.', true);
      return;
    }
    var method = editing ? 'PUT' : 'POST';
    var path = editing
      ? '/' + resource + '/' + encodeURIComponent(editing)
      : '/' + resource;
    saving = true;
    validateForm();
    try {
      setAlert('Guardando…', false);
      await ULE.api.request(path, {
        method: method,
        body: JSON.stringify(payload)
      });
      setAlert(labels[resource] + ' guardado correctamente.', false);
      closeForm();
      await load();
    } catch (err) {
      var message = 'No fue posible guardar el contenido.';
      if (err && err.data) {
        message = err.data.message || err.data.error || err.data.detail || message;
        if (typeof message === 'object') message = JSON.stringify(message);
      } else if (err && err.message) {
        message = err.message;
      }
      if (err && err.status) message += ' (HTTP ' + err.status + ')';
      setAlert(message, true);
    } finally {
      saving = false;
      validateForm();
    }
  }

  async function removeRecord(id) {
    if (!id) return;
    if (!window.confirm('¿Eliminar "' + id + '"?')) return;
    try {
      await ULE.api.request('/' + resource + '/' + encodeURIComponent(id), { method: 'DELETE' });
      setAlert('Registro eliminado.', false);
      closeForm();
      await load();
    } catch (err) {
      setAlert(err && err.message ? err.message : 'No fue posible eliminar el registro.', true);
    }
  }

  form.addEventListener('submit', onSubmit);
  form.addEventListener('input', function (event) {
    if (!editing && (event.target.name === 'titulo' || event.target.name === 'slogan')) generateId();
    validateForm();
  });
  form.addEventListener('change', validateForm);

  document.querySelectorAll('#editorial-tabs [role="tab"]').forEach(function (tab) {
    tab.addEventListener('click', function () {
      resource = tab.dataset.resource;
      listSearch = '';
      var searchInput = document.getElementById('editorial-search');
      if (searchInput) searchInput.value = '';
      document.querySelectorAll('#editorial-tabs [role="tab"]').forEach(function (x) {
        x.setAttribute('aria-selected', String(x === tab));
      });
      title.textContent = labels[resource];
      closeForm();
      load();
    });
  });

  document.getElementById('editorial-search').addEventListener('input', function (event) {
    listSearch = event.target.value;
    renderList();
  });

  document.getElementById('editorial-new').addEventListener('click', openNew);
  document.getElementById('editorial-cancel').addEventListener('click', closeForm);

  (async function () {
    try {
      if (!ULE.config || !ULE.config.apiBaseUrl) {
        setAlert('Falta ULE.config.apiBaseUrl. Revisa js/loader.js o la configuración de la API.', true);
        return;
      }
      var user = await ULE.auth.requireRole(['contributor', 'admin']);
      app.hidden = false;
      setAlert('Sesión editorial activa: ' + (user.username || user.email) + ' (' + user.role + ').', false);
      load();
    } catch (e) {
      setAlert(
        e && e.status === 401
          ? 'Debes iniciar sesión para acceder al panel editorial.'
          : 'No tienes permisos para acceder al panel editorial.',
        true
      );
    }
  })();
})();
</script>
</body>
