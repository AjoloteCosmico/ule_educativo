<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliografía — ule educativo</title>
  <meta name="description" content="Fuentes y referencias para profundizar en el estudio del juego de pelota mesoamericano.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/theme.css">

  <link rel="icon" href="assets/logo/logo.png" type="image/png">
</head>
<body>

  <a class="skip-link" href="#contenido-principal">Saltar al contenido</a>

  <header class="container">
    <nav class="nav" aria-label="Navegación principal">
      <ul class="nav__lista">
        <li><a class="nav__link" href="index.html">Inicio</a></li>
        <li><a class="nav__link" href="articulos.html">Artículos</a></li>
        <li><a class="nav__link" href="bibliografia.html" aria-current="page">Bibliografía</a></li>
        <li><a class="nav__link" href="catalogos.html">Catálogos</a></li>
      </ul>

      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Cambiar tema">
        <span class="theme-toggle__icon">
          <svg class="icon-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
          <svg class="icon-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
        </span>
        <span id="theme-label">Oscuro</span>
      </button>
    </nav>
  </header>

  <main id="contenido-principal">
    <section class="container section">
      <h1>Bibliografía</h1>
      <p>Fuentes para ampliar lo que encuentras en <em>ule educativo</em> y acercarte a otras investigaciones, publicaciones y recursos.</p>

      <form class="filtros" id="filtros-bibliografia" role="search" aria-label="Filtrar bibliografía">
        <div class="filtros__campo">
          <label for="buscar-bibliografia">Buscar</label>
          <input type="search" id="buscar-bibliografia" name="buscar" placeholder="Título, autor, editorial…" autocomplete="off">
        </div>
        <div class="filtros__campo">
          <label for="tipo-bibliografia">Tipo de fuente</label>
          <select id="tipo-bibliografia" name="tipo">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filtros__campo">
          <label for="orden-bibliografia">Ordenar por año</label>
          <select id="orden-bibliografia" name="orden">
            <option value="desc">Más recientes primero</option>
            <option value="asc">Más antiguos primero</option>
          </select>
        </div>
      </form>

      <p class="filtros__resultados" id="contador-bibliografia" aria-live="polite"></p>

      <div id="bibliografia-list" class="biblio-list">
        <div class="catalog-loading" role="status">Cargando bibliografía…</div>
      </div>
    </section>
  </main>

  <footer class="container section" style="text-align:center; opacity:0.7; font-size:var(--fs-anotacion);">
    <p>ule educativo · 2026</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/components.js"></script>
  <script>
    (function () {
      let allRefs = [];

      const list = document.getElementById('bibliografia-list');
      const contador = document.getElementById('contador-bibliografia');
      const inputBuscar = document.getElementById('buscar-bibliografia');
      const selectTipo = document.getElementById('tipo-bibliografia');
      const selectOrden = document.getElementById('orden-bibliografia');

      const tipos = {
        libro: 'Libro',
        articulo: 'Artículo',
        web: 'Sitio web'
      };

      function poblarTipos(refs) {
        const valores = Array.from(new Set(refs.map((r) => r.tipo).filter(Boolean))).sort();
        valores.forEach((tipo) => {
          const option = document.createElement('option');
          option.value = tipo;
          option.textContent = tipos[tipo] || tipo;
          selectTipo.appendChild(option);
        });
      }

      function coincideBusqueda(ref, texto) {
        if (!texto) return true;
        const autores = Array.isArray(ref.autores) ? ref.autores.join(' ') : (ref.autores || '');
        const haystack = [ref.titulo, autores, ref.editorial, ref.resumen, ref.tipo].join(' ').toLowerCase();
        return haystack.includes(texto.toLowerCase());
      }

      function render() {
        const texto = inputBuscar.value.trim();
        const tipo = selectTipo.value;
        const orden = selectOrden.value;

        let filtrados = allRefs.filter((ref) => {
          return coincideBusqueda(ref, texto) && (!tipo || ref.tipo === tipo);
        });

        filtrados.sort((a, b) => {
          const ya = Number(a.año) || 0;
          const yb = Number(b.año) || 0;
          return orden === 'asc' ? ya - yb : yb - ya;
        });

        list.innerHTML = '';

        if (!filtrados.length) {
          list.innerHTML = '<div class="catalog-empty">No hay referencias que coincidan con tu búsqueda.</div>';
        } else {
          filtrados.forEach((ref) => {
            const card = document.createElement('biblio-card');
            card.setAttribute('data-id', ref.id || '');
            card.setAttribute('data-title', ref.titulo || '');
            card.setAttribute('data-authors', Array.isArray(ref.autores) ? ref.autores.join(', ') : (ref.autores || ''));
            card.setAttribute('data-year', ref.año || '');
            card.setAttribute('data-type', ref.tipo || '');
            card.setAttribute('data-editorial', ref.editorial || '');
            card.setAttribute('data-url', ref.url || '');
            card.setAttribute('data-summary', ref.resumen || '');
            list.appendChild(card);
          });
        }

        contador.textContent = filtrados.length === 1
          ? '1 referencia encontrada'
          : filtrados.length + ' referencias encontradas';
      }

      async function init() {
        try {
          allRefs = await ULE.loader.loadBibliografia();
          poblarTipos(allRefs);
          render();
        } catch (error) {
          console.error('[ULE] Error cargando bibliografía:', error);
          list.innerHTML = '<div class="catalog-empty">No fue posible cargar la bibliografía.</div>';
          contador.textContent = '';
        }
      }

      inputBuscar.addEventListener('input', render);
      selectTipo.addEventListener('change', render);
      selectOrden.addEventListener('change', render);

      init();
    })();
  </script>
</body>
</html>
