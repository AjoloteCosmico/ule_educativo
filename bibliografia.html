<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliografía — ule educativo</title>
<meta name="description" content="Fuentes y referencias para profundizar en el estudio del juego de pelota mesoamericano.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/nav.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/ads.css">
<link rel="icon" href="assets/logo/logo.png" type="image/png">
</head>
<body data-ad-page="bibliografia">
<a class="skip-link" href="#contenido-principal">Saltar al contenido</a>
<ule-nav></ule-nav>
<main id="contenido-principal"><section class="container section"><h1>Bibliografía</h1><p>Fuentes para ampliar lo que encuentras en <em>ule educativo</em> y acercarte a otras investigaciones, publicaciones y recursos.</p><form class="filtros" id="filtros-bibliografia" role="search" aria-label="Filtrar bibliografía"><div class="filtros__campo"><label for="buscar-bibliografia">Buscar</label><input type="search" id="buscar-bibliografia" name="buscar" placeholder="Título, autor, editorial…" autocomplete="off"></div><div class="filtros__campo"><label for="tipo-bibliografia">Tipo de fuente</label><select id="tipo-bibliografia" name="tipo"><option value="">Todos</option></select></div><div class="filtros__campo"><label for="orden-bibliografia">Ordenar por año</label><select id="orden-bibliografia" name="orden"><option value="desc">Más recientes primero</option><option value="asc">Más antiguos primero</option></select></div></form><p class="filtros__resultados" id="contador-bibliografia" aria-live="polite"></p><div id="bibliografia-list" class="biblio-list"><div class="catalog-loading" role="status">Cargando bibliografía…</div></div></section><section class="container section ad-section" aria-labelledby="anuncios-bibliografia"><h2 class="ad-section__title" id="anuncios-bibliografia">Comunidad</h2><div data-ad-slot data-ad-horizontal="true"></div></section></main>
<footer class="container section" style="text-align:center; opacity:0.7; font-size:var(--fs-anotacion);"><p>ule educativo · 2026</p></footer>
<auth-modal id="auth-modal"></auth-modal>
<script src="js/main.js"></script>
<script src="js/ule-nav.js"></script>
<script src="js/api/client.js"></script>
<script src="js/api/auth.js"></script>
<script src="js/api/session.js"></script>
<script src="js/auth-modal.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/loader.js"></script>
<script src="js/components.js"></script>
<script src="js/ads.js"></script>
<script>(function(){let allRefs=[],relacionados={};const list=document.getElementById('bibliografia-list'),contador=document.getElementById('contador-bibliografia'),inputBuscar=document.getElementById('buscar-bibliografia'),selectTipo=document.getElementById('tipo-bibliografia'),selectOrden=document.getElementById('orden-bibliografia');function poblarTipos(r){Array.from(new Set(r.map(x=>x.tipo).filter(Boolean))).sort().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=ULE.labels.tipoBiblioLabel(t);selectTipo.appendChild(o);});}function coincide(r,t){if(!t)return true;const a=Array.isArray(r.autores)?r.autores.join(' '):(r.autores||'');return[r.titulo,a,r.editorial,r.resumen,ULE.labels.tipoBiblioLabel(r.tipo)].join(' ').toLowerCase().includes(t.toLowerCase());}function render(){const t=inputBuscar.value.trim(),tipo=selectTipo.value,orden=selectOrden.value;let f=allRefs.filter(r=>coincide(r,t)&&(!tipo||r.tipo===tipo));f.sort((a,b)=>{const ya=Number(a.año)||0,yb=Number(b.año)||0;return orden==='asc'?ya-yb:yb-ya;});list.innerHTML='';if(!f.length)list.innerHTML='<div class="catalog-empty">No hay referencias que coincidan con tu búsqueda.</div>';else f.forEach(r=>{const c=document.createElement('biblio-card');c.setAttribute('data-id',r.id||'');c.setAttribute('data-title',r.titulo||'');c.setAttribute('data-authors',Array.isArray(r.autores)?r.autores.join(', '):(r.autores||''));c.setAttribute('data-year',r.año||'');c.setAttribute('data-type',r.tipo||'');c.setAttribute('data-editorial',r.editorial||'');c.setAttribute('data-url',r.url||'');c.setAttribute('data-summary',r.resumen||'');c.setAttribute('data-related-articles',JSON.stringify(relacionados[r.id]||[]));c.setAttribute('data-heading-level','2');list.appendChild(c);});contador.textContent=f.length===1?'1 referencia encontrada':f.length+' referencias encontradas';}async function init(){try{allRefs=await ULE.loader.loadBibliografia();try{relacionados=await ULE.loader.loadRelatedArticlesMap();}catch(e){console.warn('[ULE] Sin artículos relacionados:',e);}poblarTipos(allRefs);render();}catch(e){console.error('[ULE] Error cargando bibliografía:',e);list.innerHTML='<div class="catalog-empty" role="alert">No fue posible cargar la bibliografía. Inténtalo de nuevo en unos minutos.</div>';contador.textContent='';}}inputBuscar.addEventListener('input',render);selectTipo.addEventListener('change',render);selectOrden.addEventListener('change',render);init();})();</script>
</body></html>
