<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artículo — ule educativo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/ads.css">

  <link rel="icon" href="assets/logo/logo.png" type="image/x-icon">
</head>
<body data-ad-page="articulo">

  <a class="skip-link" href="#contenido-principal">Saltar al contenido</a>

  <ule-nav></ule-nav>

  <main id="contenido-principal">
    <section class="container section">
      <p><a class="nav__link" href="articulos.html" style="padding-inline-start:0;">← Volver a artículos</a></p>
      <div id="articulo-contenedor">
        <p class="catalog-loading" role="status">Cargando artículo…</p>
      </div>

      <nav id="navegacion-articulos" class="articulo-navegacion" hidden aria-label="Más artículos"></nav>

      <div id="biblio-relacionada-contenedor" hidden>
        <h2>Bibliografía relacionada</h2>
        <div class="biblio-list" id="biblio-relacionada-lista"></div>
      </div>
    </section>

    <section class="container section ad-section" aria-labelledby="anuncios-articulo">
      <h2 class="ad-section__title" id="anuncios-articulo">Comunidad</h2>
      <div data-ad-slot></div>
    </section>
  </main>

  <footer class="container section" style="text-align:center; opacity:0.7; font-size:var(--fs-anotacion);">
    <p>ule educativo · 2026</p>
  </footer>

  <auth-modal id="auth-modal"></auth-modal>\n<script src="js/main.js"></script><script src="js/ule-nav.js"></script><script src="js/api/client.js"></script><script src="js/api/auth.js"></script><script src="js/api/session.js"></script><script src="js/auth-modal.js"></script><script src="js/auth-ui.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/components.js"></script>
  <script src="js/ads.js"></script>
  <script>
    (function () {
      const contenedor = document.getElementById('articulo-contenedor');
      const biblioWrap = document.getElementById('biblio-relacionada-contenedor');
      const biblioLista = document.getElementById('biblio-relacionada-lista');
      const navArticulos = document.getElementById('navegacion-articulos');

      function formatFecha(iso) {
        if (!iso) return '';
        const d = new Date(iso + 'T00:00:00');
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleDateString('es-MX', { year: 'numeric', month: 'long', day: 'numeric' });
      }

      function slug(value) {
        return String(value || '').toLowerCase().replace(/\s+/g, '-');
      }

      // Estados sin artículo (sin id, no encontrado, error): siempre con <h1> para que la página tenga encabezado principal.
      function mostrarMensaje(titulo, texto, esError) {
        const wrap = document.createElement('div');
        wrap.className = 'catalog-empty';
        if (esError) wrap.setAttribute('role', 'alert');
        const h1 = document.createElement('h1');
        h1.textContent = titulo;
        const p = document.createElement('p');
        p.textContent = texto;
        wrap.appendChild(h1);
        wrap.appendChild(p);
        contenedor.replaceChildren(wrap);
      }

      function badge(type, label) {
        const el = document.createElement('ule-badge');
        el.setAttribute('type', type);
        el.setAttribute('label', label);
        return el;
      }

      function renderArticulo(articulo) {
        const article = document.createElement('article');
        article.className = 'articulo';

        const chips = document.createElement('div');
        chips.className = 'cluster';
        chips.style.marginBlockEnd = 'var(--space-sm)';
        if (articulo.categoria) chips.appendChild(badge('categoria-' + slug(articulo.categoria), articulo.categoria));
        (articulo.etiquetas || []).forEach(function (tag) { chips.appendChild(badge('etiqueta-' + slug(tag), tag)); });
        article.appendChild(chips);

        const h1 = document.createElement('h1');
        h1.textContent = articulo.titulo || '';
        article.appendChild(h1);

        const meta = document.createElement('p');
        meta.className = 'anotacion';
        meta.textContent = [articulo.autor, formatFecha(articulo.fecha)].filter(Boolean).join(' · ');
        article.appendChild(meta);

        if (articulo.imagen_destacada) {
          const img = document.createElement('img');
          img.className = 'foto-arqueologica';
          img.style.width = '100%';
          img.style.borderRadius = 'var(--radius-md)';
          // Sin descripción editorial (imagen_alt) la imagen se trata como decorativa.
          img.alt = articulo.imagen_alt || '';
          img.addEventListener('error', function () { img.style.display = 'none'; });
          img.src = articulo.imagen_destacada;
          article.appendChild(img);
        }

        const cuerpo = document.createElement('div');
        cuerpo.className = 'articulo__cuerpo';
        // contenido_html proviene del equipo editorial (repositorio o API con acceso restringido),
        // no de entrada de usuarios anónimos. Si la API acepta HTML de otras fuentes, debe sanearlo en el servidor.
        cuerpo.innerHTML = articulo.contenido_html || '';
        article.appendChild(cuerpo);

        contenedor.replaceChildren(article);
      }

      function linkNavegacion(articulo, clase, etiqueta) {
        const a = document.createElement('a');
        a.className = 'articulo-navegacion__link ' + clase;
        a.href = 'articulo.html?id=' + encodeURIComponent(articulo.id);
        const span = document.createElement('span');
        span.textContent = etiqueta;
        const strong = document.createElement('strong');
        strong.textContent = articulo.titulo || articulo.id;
        a.appendChild(span);
        a.appendChild(strong);
        return a;
      }

      function renderNavegacion(articulo, todos) {
        const orden = todos
          .filter(function (a) { return a.visible !== false; })
          .sort(function (a, b) { return (a.fecha || '').localeCompare(b.fecha || ''); });
        const posicion = orden.findIndex(function (a) { return a.id === articulo.id; });
        if (posicion === -1) return;
        const anterior = orden[posicion - 1];
        const siguiente = orden[posicion + 1];
        if (!anterior && !siguiente) return;
        navArticulos.replaceChildren();
        if (anterior) navArticulos.appendChild(linkNavegacion(anterior, 'articulo-navegacion__link--anterior', 'Artículo anterior'));
        if (siguiente) navArticulos.appendChild(linkNavegacion(siguiente, 'articulo-navegacion__link--siguiente', 'Artículo siguiente'));
        navArticulos.hidden = false;
      }

      function renderBiblio(refs) {
        if (!refs.length) return;
        refs.forEach(function (ref) {
          const card = document.createElement('biblio-card');
          card.setAttribute('data-id', ref.id);
          card.setAttribute('data-title', ref.titulo || '');
          card.setAttribute('data-authors', Array.isArray(ref.autores) ? ref.autores.join(', ') : (ref.autores || ''));
          card.setAttribute('data-year', ref['año'] || '');
          card.setAttribute('data-type', ref.tipo || '');
          card.setAttribute('data-editorial', ref.editorial || '');
          card.setAttribute('data-url', ref.url || '');
          card.setAttribute('data-summary', ref.resumen || '');
          biblioLista.appendChild(card);
        });
        biblioWrap.hidden = false;
      }

      async function init() {
        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) {
          mostrarMensaje('Artículo no especificado', 'No se indicó qué artículo abrir. Vuelve al listado para elegir uno.');
          return;
        }

        try {
          const articulo = await ULE.loader.loadArticleById(id);
          if (!articulo || articulo.visible === false) {
            document.title = 'Artículo no encontrado — ule educativo';
            mostrarMensaje('Artículo no encontrado', 'No existe un artículo con ese identificador o ya no está disponible.');
            return;
          }

          document.title = articulo.titulo + ' — ule educativo';
          renderArticulo(articulo);

          // Lo secundario (navegación, bibliografía) no debe impedir leer el artículo si falla.
          try { renderNavegacion(articulo, await ULE.loader.loadArticles()); }
          catch (e) { console.warn('[ULE] No se pudo cargar la navegación entre artículos:', e); }
          try { renderBiblio(await ULE.loader.loadBiblioForArticle(articulo)); }
          catch (e) { console.warn('[ULE] No se pudo cargar la bibliografía relacionada:', e); }
        } catch (e) {
          console.error('[ULE] Error cargando el artículo:', e);
          mostrarMensaje('No fue posible cargar el artículo', 'Ocurrió un problema al obtener el contenido. Inténtalo de nuevo en unos minutos.', true);
        }
      }

      init();
    })();
  </script>
</body>
</html>
